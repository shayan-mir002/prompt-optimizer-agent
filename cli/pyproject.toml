[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-optimizer-cli"
version = "1.0.0"
description = "Terminal client for the Prompt Optimization Agent (talks to the existing FastAPI backend)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Prompt Optimizer Agent" }]
keywords = ["prompt", "optimization", "llm", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
]

dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
prompt-optimizer = "prompt_optimizer_cli.main:app"

[tool.setuptools.packages.find]
include = ["prompt_optimizer_cli*"]

[tool.setuptools]
py-modules = []
