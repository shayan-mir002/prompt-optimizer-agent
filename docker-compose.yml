services:
  backend:
    build: ./backend
    container_name: po-backend
    restart: unless-stopped
    # Reads API_KEY / API_BASE_URL / API_MODEL from backend/.env (kept out of the image)
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: po-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:8080
    ports:
      - "80:80"
